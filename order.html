<!DOCTYPE html>
<html>
<body>

<center>
    <h2>Order Form</h2>
</center>

<form>

    Name:<br>
    <input type="text" name="name">
    <br><br>

    Email:<br>
    <input type="text" name="email">
    <br><br>

    Choose Product:<br>
    <select name="product">
        <option>Chicken Meal</option>
        <option>Burger</option>
        <option>Spaghetti</option>
        <option>French Fries</option>
    </select>
    <br><br>

    Quantity:<br>
    <input type="number" name="quantity">
    <br><br>

    Order Type:<br>
    <input type="radio" name="order"> Dine-in
    <input type="radio" name="order"> Take-out
    <br><br>

    Add-ons:<br>
    <input type="checkbox"> Extra Rice
    <input type="checkbox"> Extra Sauce
    <input type="checkbox"> Soft Drink
    <br><br>

    Address:<br>
    <textarea name="address" rows="4" cols="30"></textarea>
    <br><br>

    <input type="submit" value="Place Order">
    <input type="reset" value="Clear">

</form>

</body>
</html>
